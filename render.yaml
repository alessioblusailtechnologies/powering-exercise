# Render Blueprint per il deploy di powering-exercise.
# Docs: https://render.com/docs/blueprint-spec
#
# - powering-api  → Web Service (Docker con Bun) — Hono + Anthropic + OpenAI + Supabase
# - powering-web  → Static Site (Vite build) — React + PrimeReact
#
# Le env var marcate `sync: false` vanno popolate nel dashboard Render
# DOPO il primo deploy (sono segrete e non vanno committate).

services:
  # ─── Backend ──────────────────────────────────────────────────────────
  - type: web
    name: powering-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: https://powering-web.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ─── Frontend ─────────────────────────────────────────────────────────
  # Docker (non Static Site) perché il monorepo usa workspace:* — il default
  # static-site di Render fa `npm install` che non capisce quel protocollo.
  # Lo stage builder usa Bun, lo stage runner serve con nginx + SPA fallback.
  - type: web
    name: powering-web
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: .
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        value: https://powering-api.onrender.com
