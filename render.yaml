# Render Blueprint per il deploy di powering-exercise.
# Docs: https://render.com/docs/blueprint-spec
#
# - powering-api  → Web Service (Docker con Bun) — Hono + Anthropic + OpenAI + Supabase
# - powering-web  → Static Site (Vite build) — React + PrimeReact
#
# Le env var marcate `sync: false` vanno popolate nel dashboard Render
# DOPO il primo deploy (sono segrete e non vanno committate).

services:
  # ─── Backend ──────────────────────────────────────────────────────────
  - type: web
    name: powering-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: https://powering-web.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ─── Frontend ─────────────────────────────────────────────────────────
  - type: web
    name: powering-web
    runtime: static
    rootDir: .
    buildCommand: |
      curl -fsSL https://bun.sh/install | bash
      export PATH="$HOME/.bun/bin:$PATH"
      bun install --frozen-lockfile
      bun run --cwd apps/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://powering-api.onrender.com
    routes:
      # SPA fallback: qualunque path non-asset → index.html (gestione lato React Router)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
